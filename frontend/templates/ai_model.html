{% extends "base.html" %} {% block content %}

<div class="title-container">
  <h1>AI Model</h1>
</div>
<div class="content-container">
  <div class="form-container">
    <form method="POST" action="{{ url_for('ai_model.ai_model') }}">
      <label for="stock-pick">Pick your stock: </label>
      <input
        type="text"
        id="stock-pick"
        name="stock-pick"
        value="{{stock_pick}}"
        required
      />
      <label for="period-pick" id="period-label">
        Select a prediction period: {{ period_pick }}
      </label>
      <input
        type="range"
        id="period-pick"
        name="period-pick"
        min="1"
        max="30"
        value="{{ period_pick }}"
        required
        oninput="document.getElementById('period-label').innerText = `Select a prediction period: ${this.value}`"
      />
      <button type="submit">Predict</button>
    </form>
  </div>

  <div class="results-container">
    <div id="plotly-graph"></div>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script>
      var graph = {{ json_graph | safe }};
      Plotly.plot("plotly-graph", graph.data, graph.layout);
    </script>
  </div>
</div>
{% endblock %}
